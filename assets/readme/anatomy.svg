<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a validated type</title>
  <desc id="desc">The declaration Validated of int16_t, Positive, AtMost 4096, annotated: int16_t is the value type and reads back as a plain int16_t; Positive and AtMost are rules that run in order, and each rule is a struct with a passes function and a requirement function.</desc>

  <rect width="1200" height="300" rx="20" fill="#0b0d10"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="60" y="52" font-size="18" fill="#8a8f98" letter-spacing="2">ONE LINE DECLARES A TYPE</text>

    <!-- the specimen; textLength pins glyph positions so the underlines line up in any monospace font -->
    <text x="146" y="140" font-size="36" fill="#f2efe8" textLength="907" lengthAdjust="spacingAndGlyphs">Validated&lt;<tspan fill="#8a8f98">int16_t</tspan>, Positive, AtMost&lt;4096&gt;&gt;</text>
  </g>

  <!-- underline: value type (chars 10..16) -->
  <line x1="362" y1="158" x2="512" y2="158" stroke="#8a8f98" stroke-width="3"/>
  <line x1="437" y1="158" x2="437" y2="190" stroke="#8a8f98" stroke-width="2"/>
  <!-- underline: rules (chars 19..40) -->
  <line x1="556" y1="158" x2="1030" y2="158" stroke="#3fb950" stroke-width="3"/>
  <line x1="793" y1="158" x2="793" y2="190" stroke="#3fb950" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="437" y="216" font-size="22" fill="#f2efe8" text-anchor="middle">value type</text>
    <text x="437" y="246" font-size="18" fill="#8a8f98" text-anchor="middle">reads back as a plain int16_t</text>

    <text x="793" y="216" font-size="22" fill="#f2efe8" text-anchor="middle">rules, run in order</text>
    <text x="793" y="246" font-size="18" fill="#8a8f98" text-anchor="middle">each is a struct with passes(v) and requirement()</text>
  </g>
</svg>
